[package]
name = "oh-procd"
version = "0.1.2"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0",  features = ["derive"] }
chrono = "0.4"
tracing-appender = "0.2.5"
anyhow = "1.0.104"
tower-http = {version = "0.6.11", features = ["trace"]}
tracing = "0.1.44"
tracing-subscriber = {version="0.3.23", features=["env-filter"]}
nix = {version="0.31.3", features = ["signal", "process","resource","mount","sched","fs","user"] }
windows-sys = "0.61.2"
config = "0.15.25"
clap = { version = "4.6.6", features = ["derive"] }
base64 = "0.22.1"
humantime-serde = "1.1.1"
libc = "0.2.189"
sysinfo = "0.38.4"
dashmap = "6.2.1"
rand = "0.10.2"
which = "8.0.5"


[profile.release]
lto = true          # Link Time Optimization
codegen-units = 1   # 减少生成单元，提高优化空间
opt-level = "z"     # "z" 优化体积，"s" 优化大小，默认 "3" 优化速度
